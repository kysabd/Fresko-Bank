<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Bank — Вход</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
      <div class="login-card">
        <h1 data-i18n="title">Fresko Bank</h1>
        <p data-i18n="subtitle">Авторизация</p>
        <form class="login-form" action="#" method="post">
          <label for="username" data-i18n="labelUsername">Логин</label>
          <input type="text" id="username" name="username" required />

          <label for="password" data-i18n="labelPassword">Пароль</label>
          <input type="password" id="password" name="password" required />

          <button type="submit" data-i18n="login">Войти</button>
        </form>
        <div class="hint" data-i18n="hint">Тестовая учетка: user / pass</div>
      </div>
    </div>

    <script>
      const text = {
        ru: {
          title: 'Fresko Bank',
          subtitle: 'Авторизация',
          labelUsername: 'Логин',
          labelPassword: 'Пароль',
          login: 'Войти',
          hint: 'Тестовая учетка: user / pass',
          pageTitle: 'Mini Bank — Вход'
        },
        en: {
          title: 'Fresko Bank',
          subtitle: 'Sign In',
          labelUsername: 'Username',
          labelPassword: 'Password',
          login: 'Log In',
          hint: 'Demo account: user / pass',
          pageTitle: 'Mini Bank — Login'
        }
      };

      function setLanguage(lang) {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          el.textContent = text[lang][key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        document.documentElement.lang = lang;
        document.title = text[lang].pageTitle;
      }

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
      });

      setLanguage('ru');
    </script>
  </body>
</html>
